version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.18.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package-lock.json" }}
            - v1-dependencies-
      - run:
          name: Install Dependencies
          command: npm ci
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package-lock.json" }}
      - run:
          name: Build Project
          command: npm run build

workflows:
  build-and-test:
    jobs:
      - build
